# assumevalid anchor node configuration.
# Installed to /etc/assumevalid/assumevalid.conf; referenced by the systemd unit.

chain=assumevalid

# Accept content as-is: this is what makes the node an assumevalid node (spec 5).
assumevalidall=1

# Keep the chain alive on its own: mine autonomously, ~1 block/minute (spec 6.1).
# Turn this off if a separate exhibition node is the block producer.
mine=1
mineinterval=60000

# P2P: accept inbound participants on the default port 9383.
listen=1

# RPC: local only. Never expose 9384 to the network.
server=1
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# Bootstrap: peers are added by participants pointing at this anchor. If you run
# a second anchor, list it here:
# addnode=<other-anchor-ip>:9383
